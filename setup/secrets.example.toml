# PLACEHOLDERS ONLY. Put actual values in Streamlit Cloud secrets, never GitHub.
[auth]
redirect_uri = "https://mixweave-dj.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "GOOGLE_OAUTH_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[private_review]
allowed_emails = ["YOUR_GOOGLE_ACCOUNT_EMAIL"]
supabase_url = "https://YOUR_PROJECT.supabase.co"
supabase_service_key = "SERVER_ONLY_SUPABASE_SERVICE_KEY"
bucket = "mixweave-private-review"
